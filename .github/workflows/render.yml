name: Render GFS maps and deploy

on:
  schedule:
    # GFS 00/06/12/18Z runs finish uploading ~3.5–4 h after cycle time.
    - cron: "10 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Specific run YYYYMMDDHH (blank = latest available)"
        required: false
      hours:
        description: "Forecast hours, e.g. 0-120/6 (blank = full 360 h)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  WX_MODEL: gfs

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (eccodes for GRIB, GEOS/PROJ for cartopy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev libgeos-dev libproj-dev

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Natural Earth shapefiles
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: natural-earth-50m-v1

      - name: Render maps
        env:
          RUN: ${{ github.event.inputs.run }}
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          ARGS="--workers 4"
          if [ -n "$HOURS" ]; then ARGS="$ARGS --hours $HOURS"; fi
          if [ -n "$RUN" ]; then ARGS="$ARGS --run $RUN"; fi
          python render/render.py $ARGS

      - name: Render tropical page
        run: python render/tropical.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
